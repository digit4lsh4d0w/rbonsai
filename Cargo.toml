[package]
name = "rbonsai"
version = "0.1.6"
edition = "2024"
description = "A terminal bonsai tree generator"
authors = [
    "Ethan Wilkes <rewilkes0041@gmail.com>",
    "Ivan Redrov <digit4lsh4d0w@ya.ru>"
]
keywords = ["bonsai", "rbonsai", "cbonsai"]
license = "GPL-3.0-or-later"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
rand = { version = "0.10.3", default-features = false }

[target.'cfg(unix)'.dependencies]
crossterm = { version = "0.29.0", default-features = false, features = ["events"] }

[target.'cfg(windows)'.dependencies]
crossterm = { version = "0.29.0", default-features = false, features = ["events", "windows"] }
